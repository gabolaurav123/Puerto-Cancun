name: Deploy main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOOK_URL: ${{ secrets.SEENODE_DEPLOY_HOOK_URL }}
      PUBLIC_DEPLOY_URL: ${{ vars.PUBLIC_DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Compute expected runtime assetVersion
        id: expected
        run: |
          expected="$(node asset-version.js)"
          printf 'assetVersion=%s\n' "$expected" >> "$GITHUB_OUTPUT"
      - name: Trigger Seenode deploy
        if: env.DEPLOY_HOOK_URL != ''
        run: curl --fail --silent --show-error --retry 2 --request POST "$DEPLOY_HOOK_URL"
      - name: Explain manual deployment requirement
        if: env.DEPLOY_HOOK_URL == ''
        run: echo "Configure the SEENODE_DEPLOY_HOOK_URL repository secret to automate production deployment."
      - name: Verify readiness and deployed assetVersion
        if: env.DEPLOY_HOOK_URL != ''
        timeout-minutes: 6
        env:
          EXPECTED_ASSET_VERSION: ${{ steps.expected.outputs.assetVersion }}
        run: node scripts/deploy-smoke.js
